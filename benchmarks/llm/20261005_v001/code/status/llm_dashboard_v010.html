<nav><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Strassen research</div><div class="nav-right"><a href="/evidence/protocol.md" target="_blank">Experiment protocol ↗</a><span class="sync" id="connection"><i class="dot"></i>Connecting</span></div></nav>
<main id="app" class="initial">Loading experiment evidence…</main>
<script>
let data=null, dtype='bfloat16', opened=new Set(), busy=false;
const names={native_default:'Default Native',native_tuned:'Tuned Native',cubic_tuned:'Tuned Cubic',s1:'Strassen 1',s2:'Strassen 2'};
const order=Object.keys(names);const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(n,d=3)=>typeof n==='number'&&Number.isFinite(n)?n.toFixed(d):'—';
const local=t=>t?new Date(t).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
function detail(id,label,body,cls=''){return `<details id="${id}" ${opened.has(id)?'open':''} class="${cls}"><summary>${label}</summary>${body}</details>`;}
function chart(d){
 const rows=(d.pilot.results||[]).filter(r=>r.output_dtype===dtype).sort((a,b)=>order.indexOf(a.algorithm)-order.indexOf(b.algorithm));
 if(!rows.length)return '<div class="empty">Timings will appear after the pilot finishes.</div>';
 const max=Math.max(...rows.map(r=>r.median_ms)),native=rows.find(r=>r.algorithm==='native_default'),best=rows.reduce((a,b)=>a.median_ms<b.median_ms?a:b);
 let body=`<div class="chart-head"><div>Algorithm</div><div>Median latency · ms</div><div class="ratio">Speedup¹</div><div>Error²</div></div>`;
 body+=rows.map(r=>`<div class="chart-row ${esc(r.algorithm)}"><div class="algo">${esc(names[r.algorithm]||r.algorithm)}${r.algorithm==='s1'?'<small>1 recursion level</small>':r.algorithm==='s2'?'<small>2 recursion levels</small>':''}</div><div class="bar-line"><div class="bar" style="width:${70*r.median_ms/max}%" aria-hidden="true"></div><span class="time">${fmt(r.median_ms)}</span></div><div class="ratio">${fmt(native?native.median_ms/r.median_ms:null,2)}×</div><div class="error">${fmt(r.errors?.relative_l2*100,2)}%</div></div>`).join('');
 body+=`<p class="chart-insight"><span>↗</span> ${esc(names[best.algorithm])} has the lowest median in this pilot.</p><p class="small-note">¹ Relative to Default Native; below 1× is slower. ² Hidden-output relative L2 vs Native.</p>`;
 const table=`<div class="details-content"><table><thead><tr><th>Algorithm</th><th>Max abs.</th><th>RMSE</th><th>Finite</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(names[r.algorithm])}</td><td>${fmt(r.errors?.max_abs,5)}</td><td>${fmt(r.errors?.rmse,6)}</td><td>${r.errors?.finite?'Yes':'No'}</td></tr>`).join('')}</tbody></table></div>`;
 body+=detail('errors','More error metrics',table);
 const policies=d.profiles.policies?.[dtype]||{};
 const tiles=Object.entries(policies).flatMap(([family,sites])=>['gateup','down'].map(site=>({family,site,a:sites[site]}))).filter(r=>r.a);
 body+=detail('tiles','Selected tiles & fusion',`<div class="details-content"><p>Gate/up and down are tuned. Q, K, V and O stay Native.</p><table><thead><tr><th>Algorithm / site</th><th>BM × BN × BK</th><th>Buffers</th></tr></thead><tbody>${tiles.map(r=>`<tr><td>${esc(names[r.family])} / ${r.site==='gateup'?'gate+up':'down'}</td><td>${esc(r.a.tile?.join(' × ')||'Native')}</td><td>${esc(r.a.buffers)}</td></tr>`).join('')}</tbody></table></div>`);
 return body;
}

const shortTime=t=>t?new Date(t).toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit',second:'2-digit'}):'—';
const duration=n=>n==null?'—':n<60?Math.floor(n)+'s':n<3600?Math.floor(n/60)+'m '+Math.floor(n%60)+'s':Math.floor(n/3600)+'h '+Math.floor(n%3600/60)+'m';
const dtypeName=x=>x==='bfloat16'?'BF16':x==='float32'?'FP32':x||'';
const ageTag=(t,suffix=' ago',warn=0)=>t?`<span class="tick" data-since="${esc(t)}" data-suffix="${esc(suffix)}" data-warn="${warn}">—</span>`:'Unavailable';
function updateAges(){document.querySelectorAll('[data-since]').forEach(e=>{const seconds=Math.max(0,(Date.now()-Date.parse(e.dataset.since))/1000);e.textContent=duration(seconds)+e.dataset.suffix;e.classList.toggle('age-old',Number(e.dataset.warn)>0&&seconds>Number(e.dataset.warn));});}
function describeEvent(e){
 const who=names[e.algorithm||e.family]||e.algorithm||e.family||'',dt=dtypeName(e.output_dtype),prefix=[dt,who].filter(Boolean).join(' · ');
 const labels={device:'Measurement worker ready',tuning_started:'Tuning started',profiles_frozen:'Tuning profiles frozen',official_checkpoint_gate_reused:'Official checkpoint qualification reused',cache_summary:'Cache statistics saved',case_complete:'Workload worker complete'};
 if(e.kind==='confirmation')return [prefix+` · round ${e.round+1}/15`,`${fmt(e.elapsed_ms,1)} ms full forward · ${fmt(e.host_preparation_seconds,2)} s host preparation`];
 if(e.kind==='candidate')return [prefix+' · tuning '+(e.site||''),`${e.status||'Candidate measured'} · compilation ${fmt(e.compile_seconds,2)} s`];
 if(e.kind==='resident_layer')return [prefix+` · resident layer ${e.layer+1}`,`${fmt(e.median_ms,3)} ms median`];
 if(e.kind==='official_checkpoint_layer_gate')return [`Official checkpoint · layer ${e.layer+1}`,e.passed?'Reference check passed':'Reference check failed'];
 if(e.kind==='heldout_quality')return [prefix+' · held-out quality','Prediction and numerical error metrics recorded'];
 if(e.kind==='tuned_layer_gate')return [prefix+' · fused layer qualification','Layer error metrics recorded'];
 if(e.kind==='comparison_complete')return [prefix+' · result emitted',`Quality gate ${e.quality_gate_passed?'passed':'failed'} · ${fmt(e.median_ms,1)} ms median`];
 if(e.kind==='cache_pilot')return [dt+' · cached weight verification',`Original and cached outputs ${e.bitwise_full_model_equal?'match exactly':'do not match'}`];
 return [labels[e.kind]||e.kind.replaceAll('_',' '),prefix];
}
function liveProgress(d){
 const p=d.progress;if(!p)return '';
 const latest=p.last_event,label=latest?describeEvent(latest):[p.reported_stage||'Waiting for evidence',''];
 const precision=p.tracks.map(t=>{
  const frozen=t.profiles_frozen?'Profiles frozen':t.tuning_started?'Tuning in progress':'Tuning not yet observed';
  return `<div class="live-track" data-track="${t.output_dtype}"><div class="track-top"><h3>${dtypeName(t.output_dtype)} output</h3><span class="track-total">${t.observed_rounds} / ${t.expected_rounds} samples observed</span></div><div class="round-row label"><span>Algorithm</span><span>Confirmation rounds</span><span class="round-count">Count</span><span class="round-time">Last ms</span></div>${t.arms.map(a=>`<div class="round-row"><span>${esc(names[a.algorithm])}</span><div class="round-cells" role="img" aria-label="${esc(names[a.algorithm])}: ${a.observed_rounds} of ${a.expected_rounds} samples observed">${Array.from({length:a.expected_rounds},(_,i)=>`<i class="${i<a.observed_rounds?'seen':''}"></i>`).join('')}</div><span class="round-count">${a.observed_rounds}/${a.expected_rounds}</span><span class="round-time">${fmt(a.last_ms,1)}</span></div>`).join('')}<p class="track-caption">${frozen} · ${t.candidates_observed} tuning candidates observed · ${t.quality_checks_observed}/4 nonbaseline quality reports${p.session?' · '+t.arms.reduce((n,a)=>n+a.resident_layers_observed,0)+'/'+(p.layers?5*p.layers:'—')+' resident layer/algorithm records':''}</p></div>`;
 }).join('');
 const quality=p.tracks.flatMap(t=>t.arms.filter(a=>a.quality).map(a=>{const q=a.quality;return `<tr><td>${dtypeName(t.output_dtype)} · ${esc(names[a.algorithm])}</td><td>${fmt(q.perplexity,3)}</td><td>${fmt(q.mean_kl,5)}</td><td>${fmt(q.top1_agreement*100,2)}%</td><td>${fmt(q.logit_relative_l2*100,2)}%</td><td>${q.finite?'Yes':'No'}</td></tr>`;})).join('');
 const measurements=p.recent_measurements.map(e=>`<tr><td>${esc(shortTime(e.utc))}</td><td>${esc(names[e.algorithm])} <span class="dtype">${dtypeName(e.output_dtype)}</span></td><td>${e.round+1}/15</td><td class="num">${fmt(e.elapsed_ms,1)}</td><td class="num">${fmt(e.resident_layer_sum_ms,2)}</td><td class="num">${fmt(e.host_preparation_seconds,2)}</td><td class="num">${e.host_cache?.cache_delta?`${e.host_cache.cache_delta.hits||0} / ${e.host_cache.cache_delta.misses||0}`:'—'}</td></tr>`).join('');
 return `<section class="panel live-detail" id="live-workload" aria-label="Detailed active workload"><div class="section-head"><div><p class="eyebrow">Current workload · detailed progress</p><h2 class="live-title">${esc(p.model_name||'Preparing next workload')}</h2></div><span class="chip ${d.stale?'warn':'good'}">${d.terminal?'Saved run':d.stale?'Snapshot stale':'Observed progress'}</span></div><div class="live-meta"><span class="chip">Batch ${esc(p.batch??'—')} × ${esc(p.sequence??'—')} tokens</span><span class="chip">${esc(p.layers??'—')} layers</span><span class="chip">${p.observed_rounds} / ${p.expected_rounds} confirmation samples</span><span class="chip">${p.session?'Cached model session':'Legacy workload'}</span></div>
 <div class="freshness"><div><span class="label">Last experiment event</span><strong>${ageTag(latest?.utc,' ago',Math.max(180,(p.sample_cadence_seconds||0)*2))}</strong><small>${esc(shortTime(latest?.utc))} · ${latest?esc(latest.kind.replaceAll('_',' ')):'No event observed'}</small></div><div><span class="label">Controller snapshot</span><strong>${ageTag(d.snapshot_utc,' ago',120)}</strong><small>${esc(shortTime(d.snapshot_utc))} · remote polling about every 30s</small></div><div><span class="label">${p.start_scope==='measurement worker'?'Measurement worker elapsed':'Workload elapsed'}</span><strong>${ageTag(p.started_utc,'')}</strong><small>${p.sample_cadence_seconds?'Recent sample cadence: '+duration(p.sample_cadence_seconds):'Sample cadence available after two samples'}</small></div></div>
 <p class="live-state"><strong>Last observed:</strong> ${esc(label[0])}${label[1]?' — '+esc(label[1]):''}. ${d.stale?'Fresh running status is unverified.':'The next operation is reported when its event arrives.'}</p><div class="live-tracks">${precision}</div><p class="live-footnote">Each filled cell is one observed full-forward sample. Five algorithms run in randomized order for 15 rounds per precision. New samples appear after host preparation, three warmups and the timed forward; the elapsed clock is not new measurement evidence. Partial timings remain provisional until the complete group is saved.</p>
 <div class="table-heading"><div><h3>Recent full-forward samples</h3><p>Newest first · full forward includes recurring weight transfer · host preparation is outside timed inference</p></div><span class="chip">Last ${p.recent_measurements.length}</span></div><div class="detail-scroll"><table class="recent-table"><thead><tr><th>Local time</th><th>Algorithm / output</th><th>Round</th><th>Full forward ms</th><th>Resident sum ms¹</th><th>Host prep s</th><th>Cache hit / miss</th></tr></thead><tbody>${measurements||'<tr><td colspan="7">No confirmation samples observed yet. Tuning and qualification appear in the activity below.</td></tr>'}</tbody></table></div><p class="small-note">¹ Layer timing inside this streamed sample; excludes transfers, embeddings and final logits. The new separate resident pass is tracked by layer above.</p>
 ${detail('live-quality','Held-out prediction and numerical errors',`<div class="details-content"><table class="quality-table"><thead><tr><th>Algorithm / output</th><th>Perplexity</th><th>Mean KL</th><th>Top-1 agreement</th><th>Logit rel. L2</th><th>Finite</th></tr></thead><tbody>${quality||'<tr><td colspan="6">No quality reports observed yet.</td></tr>'}</tbody></table><p>Fixed held-out token window; baseline agreement is the qualified Native model. These reports do not imply a completed timing comparison.</p></div>`)}
 ${detail('live-events','Recent tuning, qualification and measurement events',`<div class="event-list">${p.recent_events.map(e=>{const x=describeEvent(e);return `<div class="event-item"><time>${esc(shortTime(e.utc))}</time><div>${esc(x[0])}<small>${esc(x[1])}</small></div></div>`;}).join('')||'<p class="small-note">Waiting for the measurement worker.</p>'}</div>`)}<p class="small-note">Official checkpoint checks: ${p.official_layers_reused!=null?p.official_layers_reused+' qualified layers reused':p.official_layers_observed+' layers observed, '+p.official_layers_failed+' failed'}. ${p.events_observed} unique events recovered. ${esc(p.history_scope)}</p></section>`;
}

function render(d){
 document.querySelectorAll('details').forEach(x=>x.open?opened.add(x.id):opened.delete(x.id));
 const done=d.state==='completed'&&d.terminal,main=d.main,models=d.models||[],pilot=d.pilot?.status==='completed',mainRun=d.run_id.startsWith('case-')||d.run_id.startsWith('session-');
 const queue=d.queue,queued=queue&&queue.status;
 const headline=queued?(queue.stale?'Queue supervisor update is stale.':queue.status==='completed'?'All 700 comparisons are saved.':queue.status==='finished_with_failures'?'Sweep finished with recorded failures.':['blocked','blocked_shared_setup','paused'].includes(queue.status)?'Queue paused for recovery.':'700-comparison sweep queued.'):done?(mainRun?'Workload finished. Results saved.':'Pilot complete. Full-model study still ahead.'):d.stale?'Waiting for a fresh runtime update.':d.terminal?'This run needs attention.':'Experiment in progress.';
 const desc=queued?`${main.measured} / 700 comparisons saved · ${queue.counts.running||0} workload running · ${(queue.counts.queued||0)+(queue.counts.reserved||0)} waiting · ${(queue.counts.failed||0)+(queue.counts.blocked||0)} failed or blocked. ${queue.reason||'The supervisor saves each result group and reuses the runtime across each model’s workloads.'}`:done?(mainRun?`${main.measured} of ${main.expected} main comparisons saved. Remaining workloads and downstream evaluation are still pending.`:'The initial checks and layer pilot are saved. The main comparison grid has not started.'):d.terminal?`Run ended with status: ${d.state}. See the latest activity and saved evidence below.`:d.stale?'Waiting for a fresh controller snapshot; the last reported activity appears below.':`Current stage: ${d.active||d.state}. Main comparisons count only after paired measurements are saved.`;
 const badge=queued&&['paused','blocked_shared_setup','blocked'].includes(queue.status)?'Queue paused':d.released?'TPU released':d.terminal?'Run ended':d.stale?'Status unverified':'Active run';
 const kernelText=d.kernels.passed!=null?`${d.kernels.passed}<span> / ${d.kernels.cases}</span>`:'—';
 const semanticText=d.semantics.passed!=null?`${d.semantics.passed}<span> / ${d.semantics.passed+d.semantics.failed}</span>`:'—';
 const times=d.pilot.results?.find(r=>r.output_dtype===dtype)?.samples_ms?.length;
 let families='';let last='';for(const m of models){if(m.family!==last){families+=`<tr class="family-row"><td colspan="4">${esc(m.family.toUpperCase())}</td></tr>`;last=m.family;}families+=`<tr><td class="model-name">${esc(m.name)}<small>${esc(m.hidden?.toLocaleString())} hidden width</small></td><td class="layers">${esc(m.layers)}</td><td><span class="chip ${m.pilot?'good':''}">${m.measured?m.measured+' comparisons saved':m.pilot?'Layer pilot complete':m.metadata_ready?'Revision pinned':'Inputs pending'}</span></td><td class="coverage">${m.measured} <span style="color:#a1aba3">/ ${m.expected}</span></td></tr>`;}
 const events=(d.events||[]).map(e=>`<li class="${esc(e.tone)}"><h3>${esc(e.title)}</h3><p>${esc(e.detail)}</p>${e.time?`<time>${esc(local(e.time))}</time>`:''}</li>`).join('');
 $('#app').className='';$('#app').innerHTML=`
 <header><div><p class="eyebrow">Experiment monitor · TPU v6e</p><h1>LLM fusion <span>/</span> study</h1><p class="subtitle">Seven models. Five algorithms. Two output precisions.</p></div><div class="header-meta"><span class="chip ${d.released?'good':d.stale?'warn':''}"><i class="dot" style="width:5px;height:5px;margin:0"></i>${esc(badge)}</span><p>${d.finished_utc?'Run finished '+esc(local(d.finished_utc)):'Refreshing every 10 seconds'}</p></div></header>
 <section class="status-banner" aria-label="Current experiment status"><div class="status-icon" aria-hidden="true">${done?'✓':d.stale?'…':'→'}</div><div><h2>${esc(headline)}</h2><p>${esc(desc)}</p></div><span class="chip">${done?(mainRun?'Workload complete':'Phase 1 complete'):'Live evidence'}</span></section>
 ${queue?`<section class="panel"><div class="section-head"><div><h2>Unattended queue</h2><p>${esc(queue.status)} · ${esc(queue.counts.completed||0)} / 70 workloads complete</p></div><span class="chip">70 workloads</span></div><p>${queue.next?`Next: ${esc(queue.next.model)} · batch ${esc(queue.next.batch)} × ${esc(queue.next.sequence)} tokens.`:'No further workload waiting.'} Completed precision groups are saved before retries. Runtime and prepared weights are reused within each model session.</p><p class="small-note">Supervisor heartbeat: ${esc(local(queue.updated_utc))}. Keep this laptop powered, awake and connected. Colab credits and availability can interrupt progress.</p></section>`:''}
 ${liveProgress(d)}
 <section class="metrics" aria-label="Progress totals"><div class="metric"><div class="label">Main comparisons measured</div><div class="value">${main.measured}<span> / ${main.expected}</span></div><small>Full-model prefill grid</small><div class="progress-track"><i style="width:${main.expected?100*main.measured/main.expected:0}%"></i></div></div><div class="metric"><div class="label">Kernel qualification</div><div class="value">${kernelText}</div><small>DEFAULT arithmetic checks</small></div><div class="metric"><div class="label">Model semantics</div><div class="value">${semanticText}</div><small>Small official-model fixtures</small></div><div class="metric"><div class="label">Real-weight pilot</div><div class="value">${pilot?'1':'0'}<span> layer</span></div><small>${pilot?'Qwen3-8B · '+d.pilot.results.length+' arm/store outcomes':'Awaiting results'}</small></div></section>
 <section aria-label="Experiment stages"><div class="pipeline">${d.stages.map((s,i)=>`<div class="phase ${esc(s.state)}"><div class="phase-num">${s.state==='done'?'✓':s.state==='failed'?'!':i+1}</div><div class="phase-title">${esc(s.title)}</div><div class="phase-detail">${esc(s.detail)}</div></div>`).join('')}</div></section>
 <div class="workspace"><div class="primary"><section class="panel" id="pilot"><div class="section-head"><div><h2>Earlier layer pilot</h2><p>Qwen3-8B · resident layer 0</p></div><div class="segmented" aria-label="Output store precision"><button type="button" data-dtype="bfloat16" aria-pressed="${dtype==='bfloat16'}">BF16</button><button type="button" data-dtype="float32" aria-pressed="${dtype==='float32'}">FP32</button></div></div><div class="pilot-meta"><span class="chip">Batch ${d.pilot.batch||'—'} × ${d.pilot.sequence||'—'} tokens</span><span class="chip">${times||'—'} timing rounds</span><span class="chip">Lower latency is better</span></div>${chart(d)}<p class="small-note scope-note">Layer pilot only: excludes recurring weight transfers, embeddings and final logits. Native keeps BF16 projection boundaries in both pilot tracks; custom stores change precision. Current-workload quality reports appear above; downstream task accuracy is separate.</p></section>
 <section class="panel"><div class="section-head"><div><h2>Model coverage</h2><p>Preparation and measured results are tracked separately.</p></div><span class="chip">${models.length} models</span></div><table class="model-table"><thead><tr><th>Model</th><th class="layers">Layers</th><th>Latest evidence</th><th>Full-model runs</th></tr></thead><tbody>${families}</tbody></table><p class="small-note">Models follow the requested execution order. Each model has 10 workloads × 5 algorithms × 2 store tracks. A pinned revision or layer pilot is not a completed full-model run.</p></section></div>
 <aside class="side"><section class="panel activity-panel"><div class="section-head"><h2>Run activity</h2><span class="chip">Saved evidence</span></div><ol class="activity">${events||'<li><h3>Awaiting the first update</h3></li>'}</ol></section><section class="panel next"><p class="eyebrow">${mainRun?'Current activity':d.local_activity?.state==='working'?'Implementation activity':'Next milestone'}</p><h3>${esc(d.local_activity?.title||'Complete the full-model runner')}</h3><p>${esc(d.local_activity?.detail||'Implement streaming, per-workload tuning and held-out evaluation.')}</p><p>${esc(d.local_activity?.next_step||'')}</p><p class="small-note">Last update: ${esc(local(d.local_activity?.utc))}. ${mainRun?'Controller activity; completed measurements are counted above.':'Development activity, separate from TPU measurements.'}</p></section><section class="panel evidence"><h2>Experiment records</h2><a href="/evidence/report.md" target="_blank">Pilot report <span>↗</span></a><a href="/evidence/pilot.json" target="_blank">Timing samples & errors <span>↗</span></a><a href="/evidence/profiles.json" target="_blank">Frozen tuning profiles <span>↗</span></a><a href="/evidence/protocol.md" target="_blank">Study protocol <span>↗</span></a></section></aside></div>
 <section class="panel raw">${detail('raw','Raw logs <small>For detailed inspection</small>',`<pre>${esc(d.raw_log||'No execution log is available yet.')}</pre>`)}${detail('raw-status','Run metadata',`<pre>${esc(JSON.stringify(d.raw_status,null,2))}</pre>`)}</section>
 <footer><span>Read-only monitor · source ${esc(d.source_commit?.slice(0,9)||'unavailable')}<br>${d.terminal?'Saved run evidence · page refresh does not start experiments.':'Latest snapshot '+(d.snapshot_age_seconds==null?'unavailable':Math.round(d.snapshot_age_seconds)+' seconds ago.')}</span><button class="refresh" type="button" id="refresh">↻ Refresh now</button></footer>`;
 document.querySelectorAll('[data-dtype]').forEach(b=>b.addEventListener('click',()=>{dtype=b.dataset.dtype;render(data);}));$('#refresh').addEventListener('click',update);
 updateAges();
 $('#connection').className='sync';$('#connection').innerHTML='<i class="dot"></i>'+(d.stale?'Snapshot stale':d.terminal?'Viewing saved run':'Connected');
}
async function update(){if(busy)return;busy=true;try{let r=await fetch('/state',{cache:'no-store'});if(!r.ok)throw Error('Unavailable');data=await r.json();render(data);}catch(e){$('#connection').className='sync offline';$('#connection').textContent='Feed unavailable';if(!data)$('#app').textContent='The local evidence feed is unavailable. Refresh to try again.';}finally{busy=false;}}
update();setInterval(update,10000);setInterval(updateAges,1000);
</script></body></html>
